project:
  type: website
  output-dir: _site
  render:
    - index.md
    - perturb-seq-data-format/overview.qmd
    - perturb-seq-data-format/SPEC.md
    - perturb-seq-data-format/RATIONALE.md
    - sceptre-analysis-format/overview.qmd
    - sceptre-analysis-format/SPEC.md
    - sceptre-analysis-format/RATIONALE.md

website:
  title: "Perturb-seq formats"
  page-navigation: true
  navbar:
    right:
      - icon: github
        href: https://github.com/Katsevich-Lab/sceptre-hub
        aria-label: The repository on GitHub
  search: true
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - text: Overview
        href: index.md
      - section: Perturb-seq data file format
        href: perturb-seq-data-format/overview.qmd
        contents:
          - text: Specification
            href: perturb-seq-data-format/SPEC.md
          - text: Rationale
            href: perturb-seq-data-format/RATIONALE.md
      - section: sceptre analysis format
        href: sceptre-analysis-format/overview.qmd
        contents:
          - text: Specification
            href: sceptre-analysis-format/SPEC.md
          - text: Rationale
            href: sceptre-analysis-format/RATIONALE.md

from: markdown+gfm_auto_identifiers
execute:
  warning: false
  message: false
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    toc-expand: 1
    toc-title: On this page
    anchor-sections: true
    link-external-newwindow: true
    css: site.css
    filters:
      - rules.lua
