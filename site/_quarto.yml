project:
  type: website
  output-dir: _site
  render:
    - index.md
    - roadmap.qmd
    - file-formats/index.md
    - file-formats/perturb-seq-data-format/overview.qmd
    - file-formats/perturb-seq-data-format/SPEC.md
    - file-formats/perturb-seq-data-format/RATIONALE.md
    - file-formats/sceptre-analysis-format/overview.qmd
    - file-formats/sceptre-analysis-format/SPEC.md
    - file-formats/sceptre-analysis-format/RATIONALE.md

website:
  title: "SCEPTRE"
  page-navigation: true
  navbar:
    right:
      - icon: github
        href: https://github.com/Katsevich-Lab/sceptre-hub
        aria-label: The repository on GitHub
  search: true
  sidebar:
    style: docked
    collapse-level: 3
    contents:
      - text: Home
        href: index.md
      - text: Roadmap
        href: roadmap.qmd
      - section: File formats
        href: file-formats/index.md
        contents:
          - section: Perturb-seq data file format
            href: file-formats/perturb-seq-data-format/overview.qmd
            contents:
              - text: Specification
                href: file-formats/perturb-seq-data-format/SPEC.md
              - text: Rationale
                href: file-formats/perturb-seq-data-format/RATIONALE.md
          - section: sceptre analysis format
            href: file-formats/sceptre-analysis-format/overview.qmd
            contents:
              - text: Specification
                href: file-formats/sceptre-analysis-format/SPEC.md
              - text: Rationale
                href: file-formats/sceptre-analysis-format/RATIONALE.md

from: markdown+gfm_auto_identifiers
execute:
  warning: false
  message: false
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    toc-expand: 1
    toc-title: On this page
    anchor-sections: true
    link-external-newwindow: true
    css: site.css
    filters:
      - rules.lua
