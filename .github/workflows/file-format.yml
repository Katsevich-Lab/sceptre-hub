# The verification suite of the file format (file-format/verify/run.sh), on
# Linux and macOS, in two parts:
#   format   the validators and standard readers on the committed files; no writer
#   writers  the checks of the writers. Today these are the two writers in
#            file-format/format/; when sceptre and pysceptre write the format,
#            this part installs them and checks their files instead.
# It installs standard libraries only: neither sceptre nor pysceptre.
name: File format

# It runs when a push changes the format's folder or this file, and by hand.
on:
  push:
    branches: [main]
    paths:
      - "file-format/**"
      - ".github/workflows/file-format.yml"
  workflow_dispatch:

jobs:
  verify:
    name: ${{ matrix.part }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        part: [format, writers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python libraries
        run: pip install mudata anndata h5py pyarrow pandas scipy numpy jsonschema scanpy polars duckdb
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: System libraries for R packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libhdf5-dev libnode-dev
      - name: R libraries
        run: |
          install.packages(c("BiocManager", "jsonlite", "nanoparquet", "jsonvalidate", "arrow", "Matrix"))
          BiocManager::install(c("MuData", "rhdf5", "HDF5Array", "SingleCellExperiment", "MultiAssayExperiment"), ask = FALSE, update = FALSE)
        shell: Rscript {0}
      - name: Verification suite
        run: file-format/verify/run.sh ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.part }}-${{ matrix.os }}
          path: file-format/verify/out/results/
