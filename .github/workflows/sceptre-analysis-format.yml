# The verification suite of the sceptre analysis format
# (sceptre-analysis-format/verify/run.sh), on Linux, macOS and Windows, in two parts:
#   format   the validators and standard readers on the committed files, and the
#            standard Parquet libraries on each kind of column; no writer
#   writers  the checks of the writers. Today these are the two writers in
#            format/; when sceptre and pysceptre write the formats, this part
#            installs them and checks their files instead.
# Those install standard libraries only: neither sceptre nor pysceptre.
# A third part, on Linux, installs sceptre at a fixed commit and runs the
# checks that need it (sceptre-analysis-format/sceptre-suite/run.sh): that an
# analysis by sceptre is the same after being written to the files and rebuilt.
name: sceptre analysis format

# The analysis format builds on the data file format, so it runs when a push
# changes either folder or this file, and by hand.
on:
  push:
    branches: [main]
    paths:
      - "sceptre-analysis-format/**"
      - "perturb-seq-data-format/**"
      - ".github/workflows/sceptre-analysis-format.yml"
      # the text and the overviews: the site workflow publishes those
      - "!sceptre-analysis-format/**/*.md"
      - "!sceptre-analysis-format/overview.qmd"
      - "!sceptre-analysis-format/analysis_overview.py"
      - "!sceptre-analysis-format/scale-test/**"
      - "!perturb-seq-data-format/**/*.md"
      - "!perturb-seq-data-format/overview.qmd"
      - "!perturb-seq-data-format/overview_tools.py"
      - "!perturb-seq-data-format/scale-test/**"
  workflow_dispatch:

# checks that have started finish, so the badge never reports a cancelled run;
# of those waiting, only the newest runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: ${{ matrix.part }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        part: [format, writers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python libraries
        run: pip install mudata anndata h5py pyarrow pandas scipy numpy jsonschema scanpy polars duckdb
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: System libraries for R packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libhdf5-dev libnode-dev
      # installs binaries where there are any, and keeps the library between runs
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          install-quarto: false
          dependencies: '"hard"'
          packages: |
            any::jsonlite
            any::nanoparquet
            any::jsonvalidate
            any::arrow
            any::Matrix
            bioc::MuData
            bioc::rhdf5
            bioc::HDF5Array
            bioc::SingleCellExperiment
            bioc::MultiAssayExperiment
      # The text of the format does not start these checks (see the paths above).
      # Removing it here makes a check that came to depend on it fail.
      - name: Remove the files that do not start these checks
        shell: bash
        run: |
          git ls-files -z -- ':(glob)sceptre-analysis-format/**/*.md' 'sceptre-analysis-format/overview.qmd' 'sceptre-analysis-format/analysis_overview.py' 'sceptre-analysis-format/scale-test' ':(glob)perturb-seq-data-format/**/*.md' 'perturb-seq-data-format/overview.qmd' 'perturb-seq-data-format/overview_tools.py' 'perturb-seq-data-format/scale-test' | xargs -0 rm -f
      - name: Verification suite
        shell: bash
        run: sceptre-analysis-format/verify/run.sh ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.part }}-${{ matrix.os }}
          # the site build takes these from here instead of running the suite again
          path: |
            sceptre-analysis-format/verify/out/results/
            sceptre-analysis-format/conformance/results-*.json

  sceptre:
    name: sceptre (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: System libraries for R packages
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libhdf5-dev libnode-dev
      # installs binaries where there are any, and keeps the library between runs
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          R_BIOC_VERSION: "3.23"
        with:
          install-quarto: false
          dependencies: '"hard"'
          packages: |
            any::jsonlite
            any::nanoparquet
            any::jsonvalidate
            any::Matrix
            bioc::MuData
            bioc::rhdf5
            bioc::HDF5Array
            bioc::SingleCellExperiment
            bioc::MultiAssayExperiment
            github::Katsevich-Lab/sceptre@20c33349c2c5a0df66589e37f67238e67c53bcb0
      # The text of the format does not start these checks (see the paths above).
      # Removing it here makes a check that came to depend on it fail.
      - name: Remove the files that do not start these checks
        shell: bash
        run: |
          git ls-files -z -- ':(glob)sceptre-analysis-format/**/*.md' 'sceptre-analysis-format/overview.qmd' 'sceptre-analysis-format/analysis_overview.py' 'sceptre-analysis-format/scale-test' ':(glob)perturb-seq-data-format/**/*.md' 'perturb-seq-data-format/overview.qmd' 'perturb-seq-data-format/overview_tools.py' 'perturb-seq-data-format/scale-test' | xargs -0 rm -f
      - name: sceptre suite
        shell: bash
        run: sceptre-analysis-format/sceptre-suite/run.sh
