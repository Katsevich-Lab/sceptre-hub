# Builds the browsable site of the two formats and publishes it with GitHub
# Pages. The sources are the files of the two format folders: SPEC.md and
# RATIONALE.md, rendered as they are, and overview.qmd, which is run and
# reports the results of the verification suites. So this runs both suites,
# then site/build.sh. No HTML of the site is committed.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "perturb-seq-data-format/**"
      - "sceptre-analysis-format/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python libraries
        run: pip install mudata anndata h5py pyarrow pandas scipy numpy jsonschema scanpy polars duckdb
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: System libraries for R packages
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libhdf5-dev libnode-dev
      - name: R libraries
        run: |
          install.packages(c("BiocManager", "jsonlite", "nanoparquet", "jsonvalidate", "arrow", "Matrix", "knitr", "rmarkdown", "reticulate"))
          BiocManager::install(c("MuData", "rhdf5", "HDF5Array", "SingleCellExperiment", "MultiAssayExperiment"), ask = FALSE, update = FALSE)
          for (package in c("MuData", "nanoparquet", "arrow", "reticulate", "rmarkdown")) library(package, character.only = TRUE)
        shell: Rscript {0}
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Verification suites, whose results the overviews report
        run: |
          perturb-seq-data-format/verify/run.sh
          sceptre-analysis-format/verify/run.sh
      - name: Build the site
        run: SCEPTRE_FORMAT_PYTHON="$(command -v python)" site/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
