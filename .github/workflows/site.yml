# Builds the browsable site of the two formats from their Markdown
# (site/build.sh) and publishes it with GitHub Pages. No HTML of the site is
# committed: the Markdown files are the source, and this is the only build.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "perturb-seq-data-format/SPEC.md"
      - "perturb-seq-data-format/RATIONALE.md"
      - "perturb-seq-data-format/overview.html"
      - "sceptre-analysis-format/SPEC.md"
      - "sceptre-analysis-format/RATIONALE.md"
      - "sceptre-analysis-format/overview.html"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Build the site
        run: site/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
