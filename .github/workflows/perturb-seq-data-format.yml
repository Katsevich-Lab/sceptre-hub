# The verification suite of the Perturb-seq data file format
# (perturb-seq-data-format/verify/run.sh), on Linux, macOS and Windows. It installs
# standard libraries only and uses no analysis tool.
name: Perturb-seq data file format

# It runs when a push changes the format's folder or this file, and by hand.
on:
  push:
    branches: [main]
    paths:
      - "perturb-seq-data-format/**"
      - ".github/workflows/perturb-seq-data-format.yml"
      # the text and the overview: the site workflow publishes those
      - "!perturb-seq-data-format/**/*.md"
      - "!perturb-seq-data-format/overview.qmd"
      - "!perturb-seq-data-format/overview_tools.py"
      - "!perturb-seq-data-format/scale-test/**"
  workflow_dispatch:

jobs:
  verify:
    name: data file (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python libraries
        run: pip install mudata anndata h5py pandas scipy numpy scanpy
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: System libraries for R packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libhdf5-dev libnode-dev
      # installs binaries where there are any, and keeps the library between runs
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          install-quarto: false
          dependencies: '"hard"'
          packages: |
            any::jsonlite
            any::Matrix
            bioc::MuData
            bioc::rhdf5
            bioc::HDF5Array
            bioc::SingleCellExperiment
            bioc::MultiAssayExperiment
      # The text of the format does not start these checks (see the paths above).
      # Removing it here makes a check that came to depend on it fail.
      - name: Remove the files that do not start these checks
        shell: bash
        run: |
          git ls-files -z -- ':(glob)perturb-seq-data-format/**/*.md' 'perturb-seq-data-format/overview.qmd' 'perturb-seq-data-format/overview_tools.py' 'perturb-seq-data-format/scale-test' | xargs -0 rm -f
      - name: Verification suite
        shell: bash
        run: perturb-seq-data-format/verify/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          # the site build takes these from here instead of running the suite again
          path: |
            perturb-seq-data-format/verify/out/results/
            perturb-seq-data-format/conformance/results-*.json
